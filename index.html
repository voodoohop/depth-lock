<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0d0c" />
    <title>Depth//Lock — Magic-Eye Defusal</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #090b0a;
        --panel: #111512;
        --panel-2: #171c18;
        --line: #2b332d;
        --ink: #eff7ee;
        --muted: #8e9a90;
        --acid: #b9ff56;
        --acid-soft: rgba(185, 255, 86, 0.12);
        --danger: #ff4d36;
        --warning: #ffc247;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        padding: 24px;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 20% 0%, rgba(185, 255, 86, 0.07), transparent 30%),
          linear-gradient(135deg, transparent 0 49%, rgba(255, 255, 255, 0.018) 50% 51%, transparent 52%) 0 0 / 18px 18px,
          var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button {
        font: inherit;
      }

      button {
        color: inherit;
      }

      .game {
        width: min(1120px, 100%);
        border: 1px solid var(--line);
        background: rgba(13, 16, 14, 0.94);
        box-shadow: 0 30px 100px rgba(0, 0, 0, 0.5);
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 16px 20px;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .brand-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--acid);
        box-shadow: 0 0 16px var(--acid);
      }

      .status {
        color: var(--muted);
        font: 700 11px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .status::before {
        content: "";
        display: inline-block;
        width: 6px;
        height: 6px;
        margin-right: 8px;
        border-radius: 50%;
        background: var(--acid);
      }

      .mobile-hud {
        display: none;
      }

      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 260px;
      }

      .stage {
        min-width: 0;
        padding: 26px;
        border-right: 1px solid var(--line);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--acid);
        font: 700 11px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 720px;
        margin: 0;
        font-size: clamp(27px, 4.5vw, 56px);
        font-weight: 760;
        letter-spacing: -0.055em;
        line-height: 0.96;
      }

      .instruction {
        margin: 13px 0 22px;
        color: var(--muted);
        font-size: 14px;
      }

      .instruction strong {
        color: var(--ink);
      }

      .screen-wrap {
        position: relative;
        overflow: hidden;
        border: 1px solid #3a433c;
        background: #909885;
        box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.25);
      }

      .screen-wrap::after {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        content: "";
        background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.06) 0 1px, transparent 1px 3px);
        mix-blend-mode: multiply;
      }

      canvas {
        display: block;
        width: 100%;
        height: auto;
        image-rendering: pixelated;
      }

      .focus-guide {
        position: absolute;
        top: 17px;
        left: 50%;
        z-index: 3;
        display: flex;
        width: var(--guide-width, 92px);
        justify-content: space-between;
        transform: translateX(-50%);
        pointer-events: none;
      }

      .focus-guide span {
        width: 7px;
        height: 7px;
        border: 1px solid rgba(255, 255, 255, 0.84);
        border-radius: 50%;
        background: rgba(10, 14, 11, 0.7);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
      }

      .depth-live {
        position: absolute;
        right: 13px;
        bottom: 11px;
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 5px 7px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(8, 12, 9, 0.68);
        color: rgba(255, 255, 255, 0.72);
        font: 700 9px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        pointer-events: none;
      }

      .depth-live::before {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--acid);
        box-shadow: 0 0 8px var(--acid);
        content: "";
      }

      .depth-live.paused::before {
        background: var(--muted);
        box-shadow: none;
      }

      .choice-grid {
        display: none;
      }

      .choice {
        min-height: 62px;
        border-color: #465148;
        background: #171d18;
        font: 800 21px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.16em;
      }

      .choice:active {
        border-color: var(--acid);
        background: var(--acid);
        color: #11170d;
        transform: scale(0.98);
      }

      .choice.wrong {
        border-color: var(--danger);
        background: rgba(255, 77, 54, 0.12);
        color: var(--danger);
      }

      .choice.correct {
        border-color: var(--acid);
        background: var(--acid);
        color: #11170d;
      }

      button {
        min-height: 48px;
        border: 1px solid var(--line);
        border-radius: 0;
        background: var(--panel-2);
        cursor: pointer;
        font-weight: 800;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      button:hover {
        border-color: #657168;
        background: #202720;
      }

      button:focus-visible {
        outline: 2px solid var(--acid);
        outline-offset: 2px;
      }

      .feedback {
        min-height: 20px;
        margin: 10px 0 0;
        color: var(--muted);
        font: 600 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .feedback.good {
        color: var(--acid);
      }

      .feedback.bad {
        color: var(--danger);
      }

      .overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        padding: 24px;
        background: rgba(4, 5, 4, 0.84);
        backdrop-filter: blur(9px);
      }

      .overlay[hidden] {
        display: none;
      }

      .modal {
        width: min(520px, 100%);
        border: 1px solid #465148;
        background: #111512;
        padding: clamp(24px, 5vw, 44px);
        box-shadow: 0 30px 90px #000;
      }

      .modal h2 {
        margin: 0 0 12px;
        font-size: clamp(30px, 8vw, 54px);
        letter-spacing: -0.055em;
        line-height: 0.95;
      }

      .modal p {
        margin: 0 0 22px;
        color: var(--muted);
        line-height: 1.6;
      }

      .modal button {
        width: 100%;
        border-color: var(--acid);
        background: var(--acid);
        color: #10150d;
      }

      .modal .share-button {
        margin-top: 10px;
        border-color: #465148;
        background: transparent;
        color: var(--ink);
      }

      .modal .share-button:hover {
        background: #1b211c;
      }

      .shake {
        animation: shake 220ms linear;
      }

      @keyframes shake {
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
      }

      /* Unified full-screen game surface */
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        display: block;
        padding: 0;
        background: #080a08;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }

      .game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100dvh;
        overflow: hidden;
        border: 0;
        background: #78836f;
        box-shadow: none;
      }

      header {
        position: absolute;
        top: 0;
        right: 0;
        left: 0;
        z-index: 6;
        padding: calc(7px + env(safe-area-inset-top)) clamp(8px, 1.5vw, 16px) 13px;
        border: 0;
        background: linear-gradient(to bottom, rgba(5, 8, 6, 0.9), rgba(5, 8, 6, 0.55) 65%, transparent);
        backdrop-filter: none;
      }

      header::after {
        position: absolute;
        right: 0;
        bottom: 4px;
        left: 0;
        width: var(--mobile-progress, 100%);
        height: 1px;
        background: var(--acid);
        content: "";
        transition: width 90ms linear;
      }

      .brand {
        color: rgba(255, 255, 255, 0.92);
        gap: 6px;
        font-size: 9px;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.65);
      }

      .mobile-hud {
        display: flex;
        align-items: center;
        gap: clamp(6px, 1.3vw, 12px);
        color: rgba(255, 255, 255, 0.65);
        font: 750 8px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .sound-toggle {
        min-height: 24px;
        padding: 0 6px;
        border-color: rgba(255, 255, 255, 0.28);
        border-radius: 8px;
        background: rgba(8, 12, 9, 0.58);
        color: rgba(255, 255, 255, 0.72);
        font: 800 7px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.07em;
        backdrop-filter: blur(9px);
      }

      main,
      .stage,
      .screen-wrap {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      main {
        display: block;
      }

      .stage {
        min-width: 0;
        padding: 0;
        border: 0;
      }

      .screen-wrap {
        z-index: 0;
        display: grid;
        overflow: hidden;
        border: 0;
        border-radius: 0;
        background: #060906;
        box-shadow: none;
        place-items: center;
      }

      canvas {
        width: auto;
        max-width: 100%;
        height: auto;
        max-height: 100%;
        object-fit: contain;
        object-position: center;
      }

      .focus-guide {
        top: calc(94px + env(safe-area-inset-top));
      }

      .control-deck {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 5;
        padding: 18px 8px calc(5px + env(safe-area-inset-bottom));
        background: linear-gradient(to bottom, transparent, rgba(5, 8, 6, 0.48) 48%, rgba(5, 8, 6, 0.78));
        pointer-events: none;
      }

      .choice-grid {
        display: grid;
        width: min(520px, calc(100% - 24px));
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: clamp(5px, 1vw, 8px);
        margin: 0 auto;
        border: 0;
        padding: 0;
        pointer-events: auto;
      }

      .choice {
        min-width: 0;
        min-height: clamp(38px, 5dvh, 44px);
        padding: 0 4px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 9px;
        background: rgba(8, 12, 9, 0.7);
        color: white;
        font-size: clamp(13px, 2vw, 17px);
        letter-spacing: 0.06em;
        box-shadow: 0 5px 16px rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(12px);
        touch-action: manipulation;
      }

      .choice:hover {
        border-color: var(--acid);
        background: rgba(19, 27, 18, 0.82);
      }

      .feedback {
        width: min(520px, calc(100% - 24px));
        min-height: 9px;
        margin: 0 auto 3px;
        color: rgba(255, 255, 255, 0.78);
        font-size: 7px;
        text-align: center;
        text-shadow: 0 1px 5px black;
      }

      .critical header::after {
        background: var(--danger);
      }

      .overlay {
        align-items: end;
        padding: 0;
        background: rgba(4, 5, 4, 0.54);
      }

      .modal {
        width: min(560px, calc(100% - 24px));
        border-radius: 18px 18px 0 0;
        padding: 30px 22px calc(20px + env(safe-area-inset-bottom));
      }

      .modal button {
        min-height: 56px;
        border-radius: 11px;
      }

      /* Low-fi terminal treatment kept outside the stereogram itself. */
      body {
        font-family: "Courier New", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .game::after {
        position: absolute;
        inset: 0;
        z-index: 8;
        pointer-events: none;
        content: "";
        box-shadow:
          inset 0 0 70px rgba(0, 0, 0, 0.34),
          inset 0 0 2px rgba(185, 255, 86, 0.28);
      }

      header {
        background: linear-gradient(to bottom, rgba(3, 7, 4, 0.94), rgba(3, 7, 4, 0.56) 70%, transparent);
      }

      .brand {
        color: var(--acid);
        font-family: "Courier New", ui-monospace, monospace;
        text-shadow: 0 0 9px rgba(185, 255, 86, 0.42);
      }

      .brand-dot,
      .focus-guide span {
        border-radius: 1px;
      }

      .sound-toggle {
        border-color: rgba(185, 255, 86, 0.42);
        border-radius: 1px;
        background: rgba(4, 10, 5, 0.7);
        color: var(--acid);
        backdrop-filter: blur(6px);
      }

      .screen-wrap::after {
        background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.11) 0 1px, transparent 1px 4px);
      }

      .focus-guide span {
        border-color: rgba(185, 255, 86, 0.8);
        box-shadow: 0 0 6px rgba(185, 255, 86, 0.48);
      }

      .choice {
        border-color: rgba(185, 255, 86, 0.42);
        border-radius: 1px;
        background: rgba(3, 9, 4, 0.78);
        color: #e9ffd0;
        font-family: "Courier New", ui-monospace, monospace;
        box-shadow:
          0 5px 16px rgba(0, 0, 0, 0.2),
          inset 0 0 10px rgba(185, 255, 86, 0.035);
        backdrop-filter: blur(8px);
      }

      .choice:hover {
        background: rgba(185, 255, 86, 0.13);
        color: var(--acid);
        text-shadow: 0 0 7px rgba(185, 255, 86, 0.5);
      }

      .feedback {
        color: rgba(211, 255, 157, 0.88);
        letter-spacing: 0.08em;
      }

      .overlay {
        background: rgba(1, 5, 2, 0.66);
      }

      .modal {
        border-color: rgba(185, 255, 86, 0.56);
        border-radius: 1px;
        background: rgba(4, 10, 5, 0.95);
        box-shadow:
          0 22px 70px rgba(0, 0, 0, 0.72),
          0 0 22px rgba(185, 255, 86, 0.08);
      }

      .modal h2 {
        color: #e9ffd0;
        text-shadow: 0 0 14px rgba(185, 255, 86, 0.16);
      }

      .modal button {
        border-radius: 1px;
      }

      @media (max-width: 520px) {
        header {
          padding: calc(5px + env(safe-area-inset-top)) 6px 8px;
        }

        header::after {
          bottom: 3px;
          height: 1px;
        }

        .brand {
          gap: 4px;
          font-size: 8px;
          letter-spacing: 0.08em;
        }

        .brand-dot {
          width: 5px;
          height: 5px;
        }

        .mobile-hud {
          gap: 5px;
          font-size: 8px;
        }

        .sound-toggle {
          min-height: 22px;
          padding: 0 5px;
          font-size: 7px;
        }

        .control-deck {
          padding: 10px 4px calc(3px + env(safe-area-inset-bottom));
        }

        .choice {
          min-height: 38px;
          padding: 0 2px;
          font-size: clamp(13px, 3.8vw, 15px);
          letter-spacing: 0.04em;
        }

        .feedback {
          min-height: 10px;
          margin-bottom: 3px;
          font-size: 7px;
        }

        .modal {
          width: 100%;
          border-right: 0;
          border-bottom: 0;
          border-left: 0;
        }
      }

      @media (max-height: 520px) {
        header {
          padding: calc(3px + env(safe-area-inset-top)) 6px 6px;
        }

        header::after {
          bottom: 2px;
          height: 1px;
        }

        .brand {
          gap: 4px;
          font-size: 8px;
        }

        .brand-dot {
          width: 5px;
          height: 5px;
        }

        .mobile-hud {
          gap: 6px;
          font-size: 8px;
        }

        .sound-toggle {
          min-height: 20px;
          padding: 0 5px;
          font-size: 7px;
        }

        .control-deck {
          padding: 7px 4px calc(2px + env(safe-area-inset-bottom));
          background: linear-gradient(to bottom, transparent, rgba(5, 8, 6, 0.48) 42%, rgba(5, 8, 6, 0.82));
        }

        .feedback {
          min-height: 9px;
          margin-bottom: 2px;
          font-size: 7px;
        }

        .choice {
          min-height: 34px;
          font-size: 12px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto;
          animation-duration: 0.01ms;
          animation-iteration-count: 1;
        }
      }
    </style>
  </head>
  <body>
    <section class="game" id="game">
      <header>
        <div class="brand"><span class="brand-dot"></span>Depth//Lock</div>
        <section class="mobile-hud" aria-label="Game status">
          <span>L<span id="mobileLevelValue">01</span></span>
          <span>S<span id="mobileScoreValue">00</span></span>
          <button class="sound-toggle" id="soundToggle" type="button" aria-label="Mute sound">SND ON</button>
        </section>
      </header>

      <main>
        <section class="stage">
          <div class="screen-wrap" id="screenWrap">
            <canvas id="stereogram" width="840" height="460" aria-label="Magic Eye stereogram with a hidden code"></canvas>
            <div class="focus-guide" id="focusGuide" aria-hidden="true"><span></span><span></span></div>
          </div>

          <div class="control-deck">
            <p class="feedback" id="feedback" role="status" aria-live="polite">AWAITING CALIBRATION_</p>
            <fieldset class="choice-grid" id="choiceGrid" aria-label="Select code"></fieldset>
          </div>
        </section>
      </main>
    </section>

    <div class="overlay" id="overlay">
      <div class="modal">
        <p class="eyebrow" id="modalEyebrow">VISUAL ACCESS REQUIRED</p>
        <h2 id="modalTitle">CAN YOU SEE<br />THE DEPTH?</h2>
        <p id="modalText">
          Hidden characters float above a living cellular field. Start with one letter. Every solved code increases the difficulty.
        </p>
        <button id="startButton" type="button">INITIATE SEQUENCE</button>
        <button class="share-button" id="shareButton" type="button">SHARE SIGNAL</button>
      </div>
    </div>

    <script>
      (() => {
        const canvas = document.querySelector("#stereogram");
        const ctx = canvas.getContext("2d", { alpha: false });
        const screenWrap = document.querySelector("#screenWrap");
        const focusGuide = document.querySelector("#focusGuide");
        const choiceGrid = document.querySelector("#choiceGrid");
        const feedback = document.querySelector("#feedback");
        const game = document.querySelector("#game");
        const mobileLevelValue = document.querySelector("#mobileLevelValue");
        const mobileScoreValue = document.querySelector("#mobileScoreValue");
        const soundToggle = document.querySelector("#soundToggle");
        const overlay = document.querySelector("#overlay");
        const modalEyebrow = document.querySelector("#modalEyebrow");
        const modalTitle = document.querySelector("#modalTitle");
        const modalText = document.querySelector("#modalText");
        const startButton = document.querySelector("#startButton");
        const shareButton = document.querySelector("#shareButton");

        const easyCharacters = "AHKTXV147";
        const allCharacters = "ABCDEFGHJKLMNPRTUVWXYZ2345679";
        const palette = [
          [18, 28, 21],
          [39, 54, 41],
          [78, 94, 72],
          [124, 139, 103],
          [167, 177, 128],
          [205, 211, 158],
          [96, 113, 84],
          [45, 62, 48],
        ];
        const stereogramAspect = 840 / 460;
        const treeProgram = makeTreeProgram(6);

        let level = 1;
        let score = 0;
        let currentCode = "A";
        let running = false;
        let deadline = 0;
        let levelDuration = 40;
        let frameId = 0;
        let resizeTimer = 0;
        let audioContext = null;
        let soundEnabled = true;
        let lastTickBucket = -1;
        let levelStartedAt = 0;
        let lastStereoFrame = 0;
        let lastAutomataFrame = 0;
        let stereoState = null;
        const motionEnabled = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        function codeLengthForLevel(value) {
          if (value < 4) return 1;
          if (value < 8) return 2;
          if (value < 13) return 3;
          return 4;
        }

        function durationForLevel(value) {
          return Math.max(7, 18 - (value - 1) * 0.65);
        }

        function makeCode(length) {
          const characters = level < 5 ? easyCharacters : allCharacters;
          let code = "";
          for (let index = 0; index < length; index += 1) {
            code += characters[Math.floor(Math.random() * characters.length)];
          }
          return code;
        }

        function makeChoices(code) {
          const choices = new Set([code]);
          while (choices.size < 4) {
            const candidate = [...code];
            const position = Math.floor(Math.random() * candidate.length);
            let replacement = candidate[position];
            while (replacement === candidate[position]) {
              replacement = allCharacters[Math.floor(Math.random() * allCharacters.length)];
            }
            candidate[position] = replacement;
            choices.add(candidate.join(""));
          }

          const shuffled = [...choices];
          for (let index = shuffled.length - 1; index > 0; index -= 1) {
            const target = Math.floor(Math.random() * (index + 1));
            [shuffled[index], shuffled[target]] = [shuffled[target], shuffled[index]];
          }
          return shuffled;
        }

        function renderChoices() {
          const buttons = makeChoices(currentCode).map((code) => {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "choice";
            button.dataset.code = code;
            button.textContent = code;
            button.setAttribute("aria-label", `Code ${code}`);
            return button;
          });
          choiceGrid.replaceChildren(...buttons);
        }

        function makeDepthMap(width, height, code, separation) {
          const depthCanvas = document.createElement("canvas");
          depthCanvas.width = width;
          depthCanvas.height = height;
          const depthContext = depthCanvas.getContext("2d");

          const topSafeArea = Math.round(height * 0.13);
          const availableWidth = width * (code.length === 1 ? 0.46 : 0.66);
          const sizeByWidth = availableWidth / (code.length * 0.72);
          // A glyph wider than a stereogram repetition can resolve as a second echo,
          // especially on narrow portrait screens.
          const repetitionSafeSize = separation * (code.length === 1 ? 1.45 : 1.18);
          const fontSize = Math.floor(Math.min(height * 0.54, sizeByWidth, repetitionSafeSize));

          depthContext.fillStyle = "black";
          depthContext.fillRect(0, 0, width, height);
          depthContext.font = `900 ${fontSize}px Arial Black, Arial, sans-serif`;
          depthContext.textAlign = "center";
          depthContext.textBaseline = "middle";
          depthContext.lineJoin = "round";
          depthContext.strokeStyle = "#777";
          depthContext.lineWidth = Math.max(4, fontSize * 0.075);
          const textY = topSafeArea + (height - topSafeArea) / 2 + fontSize * 0.03;
          depthContext.strokeText(code, width / 2, textY);
          depthContext.fillStyle = "white";
          depthContext.fillText(code, width / 2, textY);

          return depthContext.getImageData(0, 0, width, height).data;
        }

        function makeTreeProgram(iterations) {
          let program = "X";
          for (let iteration = 0; iteration < iterations; iteration += 1) {
            program = [...program].map((symbol) => (symbol === "X" ? "F[+X][-X]" : symbol)).join("");
          }
          return program;
        }

        function makeTreeLayer(width, height) {
          const treeCanvas = document.createElement("canvas");
          treeCanvas.width = width;
          treeCanvas.height = height;
          return {
            canvas: treeCanvas,
            context: treeCanvas.getContext("2d"),
            depthMap: null,
          };
        }

        function drawLSystemTree(context, options) {
          let x = options.x;
          let y = options.y;
          let heading = -Math.PI / 2 + options.lean;
          let segmentLength = options.segmentLength;
          let thickness = options.thickness;
          const stack = [];

          context.strokeStyle = options.depthColor;
          context.lineCap = "round";
          context.lineJoin = "round";

          for (const symbol of treeProgram) {
            if (symbol === "F") {
              const nextX = x + Math.cos(heading) * segmentLength;
              const nextY = y + Math.sin(heading) * segmentLength;
              context.lineWidth = thickness;
              context.beginPath();
              context.moveTo(x, y);
              context.lineTo(nextX, nextY);
              context.stroke();
              x = nextX;
              y = nextY;
            } else if (symbol === "+") {
              heading += options.branchAngle;
            } else if (symbol === "-") {
              heading -= options.branchAngle;
            } else if (symbol === "[") {
              stack.push({ x, y, heading, segmentLength, thickness });
              segmentLength *= options.lengthRatio;
              thickness *= 0.72;
            } else if (symbol === "]") {
              ({ x, y, heading, segmentLength, thickness } = stack.pop());
            }
          }
        }

        function updateTreeDepth(now) {
          const { width, height, treeLayer } = stereoState;
          const treeContext = treeLayer.context;
          const time = now * 0.00034;
          const trees = [
            { x: 0.2, size: 0.185, phase: 0.2, depth: "#3d3d3d" },
            { x: 0.5, size: 0.245, phase: 2.25, depth: "#4d4d4d" },
            { x: 0.8, size: 0.19, phase: 4.4, depth: "#3d3d3d" },
          ];

          treeContext.fillStyle = "black";
          treeContext.fillRect(0, 0, width, height);

          for (const tree of trees) {
            drawLSystemTree(treeContext, {
              x: width * tree.x,
              y: height * 0.94,
              lean: Math.sin(time * 0.72 + tree.phase) * 0.12,
              segmentLength: height * tree.size * (0.96 + Math.sin(time * 0.51 + tree.phase) * 0.06),
              thickness: Math.max(3, width * tree.size * 0.055),
              branchAngle: 0.38 + Math.sin(time + tree.phase) * 0.12,
              lengthRatio: 0.71 + Math.sin(time * 0.61 + tree.phase) * 0.055,
              depthColor: tree.depth,
            });
          }

          treeLayer.depthMap = treeContext.getImageData(0, 0, width, height).data;
        }

        function makeAutomata(width, height) {
          const cellSize = Math.max(24, Math.round(width / 24));
          const columns = Math.ceil(width / cellSize);
          const rows = Math.ceil(height / cellSize);
          const cells = new Uint8Array(columns * rows);
          const nextCells = new Uint8Array(cells.length);

          for (let index = 0; index < cells.length; index += 1) {
            const seed = Math.random();
            cells[index] = seed < 0.12 ? 1 : seed < 0.24 ? 2 : 0;
          }

          return { cellSize, columns, rows, cells, nextCells };
        }

        function advanceAutomata() {
          if (!stereoState) return;
          const { columns, rows, cells, nextCells } = stereoState.automata;

          for (let row = 0; row < rows; row += 1) {
            for (let column = 0; column < columns; column += 1) {
              const index = row * columns + column;
              const state = cells[index];

              if (state === 1) {
                nextCells[index] = 2;
                continue;
              }
              if (state === 2) {
                nextCells[index] = 0;
                continue;
              }

              let firingNeighbors = 0;
              for (let offsetY = -1; offsetY <= 1; offsetY += 1) {
                for (let offsetX = -1; offsetX <= 1; offsetX += 1) {
                  if (offsetX === 0 && offsetY === 0) continue;
                  const neighborColumn = (column + offsetX + columns) % columns;
                  const neighborRow = (row + offsetY + rows) % rows;
                  if (cells[neighborRow * columns + neighborColumn] === 1) firingNeighbors += 1;
                }
              }
              nextCells[index] = firingNeighbors === 2 ? 1 : 0;
            }
          }

          stereoState.automata.cells = nextCells;
          stereoState.automata.nextCells = cells;
        }

        function automataDepthAt(x, y) {
          const { cellSize, columns, cells } = stereoState.automata;
          const localX = x % cellSize;
          const localY = y % cellSize;
          if (localX === 0 || localY === 0) return 0;

          const column = Math.floor(x / cellSize);
          const row = Math.floor(y / cellSize);
          const state = cells[row * columns + column];
          if (state === 1) return 0.28;
          if (state === 2) return 0.05;
          return 0;
        }

        function getStereogramDisplaySize() {
          const viewportWidth = Math.max(1, Math.floor(screenWrap.clientWidth));
          const viewportHeight = Math.max(1, Math.floor(screenWrap.clientHeight));
          let displayWidth = viewportWidth;
          let displayHeight = Math.round(displayWidth / stereogramAspect);

          if (displayHeight > viewportHeight) {
            displayHeight = viewportHeight;
            displayWidth = Math.round(displayHeight * stereogramAspect);
          }

          return { viewportWidth, viewportHeight, displayWidth, displayHeight };
        }

        function prepareStereogram(code) {
          const { viewportWidth, viewportHeight, displayWidth, displayHeight } = getStereogramDisplaySize();
          const renderScale = Math.min(1, 1100 / displayWidth, 760 / displayHeight);
          const width = Math.round(displayWidth * renderScale);
          const height = Math.round(displayHeight * renderScale);
          const minimumSeparation = displayWidth < 600 ? 88 : 100;
          const maximumSeparation = displayWidth >= 760 ? 150 : 120;
          const guideSeparation = Math.max(
            minimumSeparation,
            Math.min(maximumSeparation, Math.round(displayWidth * 0.16)),
          );
          const separation = Math.round(guideSeparation * renderScale);
          const depthShift = Math.max(8, Math.round(separation * Math.max(0.11, 0.18 - level * 0.004)));

          canvas.width = width;
          canvas.height = height;
          canvas.style.width = `${displayWidth}px`;
          canvas.style.height = `${displayHeight}px`;
          focusGuide.style.setProperty("--guide-width", `${guideSeparation}px`);
          focusGuide.style.top = `${Math.round((viewportHeight - displayHeight) / 2) + 42}px`;

          stereoState = {
            code,
            viewportWidth,
            viewportHeight,
            displayWidth,
            displayHeight,
            width,
            height,
            separation,
            depthShift,
            depthMap: makeDepthMap(width, height, code, separation),
            automata: makeAutomata(width, height),
            treeLayer: makeTreeLayer(width, height),
          };
        }

        function generateStereogram(code, depthAmount = 1) {
          const { viewportWidth, viewportHeight, displayWidth, displayHeight } = getStereogramDisplaySize();
          if (
            !stereoState ||
            stereoState.code !== code ||
            stereoState.viewportWidth !== viewportWidth ||
            stereoState.viewportHeight !== viewportHeight ||
            stereoState.displayWidth !== displayWidth ||
            stereoState.displayHeight !== displayHeight
          ) {
            prepareStereogram(code);
          }

          const { width, height, separation, depthShift, depthMap } = stereoState;
          updateTreeDepth(performance.now());
          const image = ctx.createImageData(width, height);
          const pixels = image.data;

          for (let y = 0; y < height; y += 1) {
            for (let x = 0; x < width; x += 1) {
              const pixelIndex = (y * width + x) * 4;
              const codeDepth = depthMap[pixelIndex] / 255;
              const treeDepth = stereoState.treeLayer.depthMap[pixelIndex] / 255;
              const sceneryDepth = Math.max(treeDepth, automataDepthAt(x, y)) * 0.55;
              const depth = codeDepth > 0.08 ? 0.72 + codeDepth * 0.28 : sceneryDepth;

              if (x < separation) {
                const grain = Math.floor(Math.random() * palette.length);
                const color = palette[grain];
                const variation = Math.floor(Math.random() * 18) - 9;
                pixels[pixelIndex] = color[0] + variation;
                pixels[pixelIndex + 1] = color[1] + variation;
                pixels[pixelIndex + 2] = color[2] + variation;
              } else {
                const localShift = Math.round(depthShift * depth * depthAmount);
                const sourceX = x - separation + localShift;
                const sourceIndex = (y * width + sourceX) * 4;
                pixels[pixelIndex] = pixels[sourceIndex];
                pixels[pixelIndex + 1] = pixels[sourceIndex + 1];
                pixels[pixelIndex + 2] = pixels[sourceIndex + 2];
              }
              pixels[pixelIndex + 3] = 255;
            }
          }

          ctx.putImageData(image, 0, 0);
        }

        function updateStats() {
          mobileLevelValue.textContent = String(level).padStart(2, "0");
          mobileScoreValue.textContent = String(score).padStart(2, "0");
        }

        function startLevel() {
          currentCode = level === 1 ? "A" : makeCode(codeLengthForLevel(level));
          levelDuration = durationForLevel(level);
          deadline = performance.now() + levelDuration * 1000;
          levelStartedAt = performance.now();
          lastTickBucket = -1;
          lastStereoFrame = 0;
          lastAutomataFrame = 0;
          stereoState = null;
          feedback.className = "feedback";
          feedback.textContent = "DECODE + SELECT · ERROR PENALTY: 3 SEC";
          generateStereogram(currentCode, motionEnabled ? 0.72 : 1);
          renderChoices();
          updateStats();
        }

        function playTick(urgent) {
          if (!audioContext || !soundEnabled) return;
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();
          const now = audioContext.currentTime;
          oscillator.type = "square";
          oscillator.frequency.value = urgent ? 760 : 520;
          gain.gain.setValueAtTime(0.035, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.035);
          oscillator.connect(gain).connect(audioContext.destination);
          oscillator.start(now);
          oscillator.stop(now + 0.04);
        }

        function playSignal(frequencies, type = "sine") {
          if (!audioContext || !soundEnabled) return;
          const startTime = audioContext.currentTime;
          frequencies.forEach((frequency, index) => {
            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();
            const noteStart = startTime + index * 0.085;
            oscillator.type = type;
            oscillator.frequency.value = frequency;
            gain.gain.setValueAtTime(0.07, noteStart);
            gain.gain.exponentialRampToValueAtTime(0.0001, noteStart + 0.1);
            oscillator.connect(gain).connect(audioContext.destination);
            oscillator.start(noteStart);
            oscillator.stop(noteStart + 0.11);
          });
        }

        function updateTimer(now) {
          if (!running) return;
          const remaining = Math.max(0, (deadline - now) / 1000);
          const progress = Math.max(0, Math.min(100, (remaining / levelDuration) * 100));
          const tickInterval = remaining <= 7 ? 0.5 : 1;
          const tickBucket = Math.ceil(remaining / tickInterval);
          if (tickBucket !== lastTickBucket) {
            lastTickBucket = tickBucket;
            playTick(remaining <= 7);
          }
          if (motionEnabled && now - lastAutomataFrame >= 420) {
            advanceAutomata();
            lastAutomataFrame = now;
          }
          if (motionEnabled && now - lastStereoFrame >= 110) {
            const animationAge = now - levelStartedAt;
            const emergence = Math.min(1, 0.72 + animationAge / 900);
            const breathing = 0.97 + Math.sin(animationAge / 520) * 0.03;
            generateStereogram(currentCode, emergence * breathing);
            lastStereoFrame = now;
          }
          game.style.setProperty("--mobile-progress", `${progress}%`);
          game.classList.toggle("critical", remaining <= 7);

          if (remaining <= 0) {
            endGame();
            return;
          }
          frameId = requestAnimationFrame(updateTimer);
        }

        function beginGame() {
          level = 1;
          score = 0;
          running = true;
          audioContext ??= new AudioContext();
          audioContext.resume();
          overlay.hidden = true;
          startLevel();
          cancelAnimationFrame(frameId);
          frameId = requestAnimationFrame(updateTimer);
        }

        function flashError(message) {
          feedback.className = "feedback bad";
          feedback.textContent = message;
          screenWrap.classList.remove("shake");
          void screenWrap.offsetWidth;
          screenWrap.classList.add("shake");
        }

        function checkAnswer(guess, choiceButton) {
          if (guess === currentCode) {
            playSignal([620, 820, 1040]);
            feedback.className = "feedback good";
            feedback.textContent = "ACCESS GRANTED · NEXT SECTOR";

            const advanceLevel = () => {
              if (!running) return;
              score += 1;
              level += 1;
              startLevel();
            };

            choiceButton.classList.add("correct");
            for (const button of choiceGrid.querySelectorAll("button")) button.disabled = true;
            navigator.vibrate?.(35);
            deadline += 180;
            window.setTimeout(advanceLevel, 160);
          } else {
            playSignal([180, 125], "square");
            deadline -= 3000;
            choiceButton.classList.add("wrong");
            choiceButton.disabled = true;
            navigator.vibrate?.([55, 35, 55]);
            flashError("ACCESS DENIED · 3 SECONDS LOST");
          }
        }

        function endGame() {
          running = false;
          playSignal([260, 190, 120], "sawtooth");
          navigator.vibrate?.([90, 50, 140]);
          cancelAnimationFrame(frameId);
          game.classList.remove("critical");
          game.style.setProperty("--mobile-progress", "0%");
          for (const button of choiceGrid.querySelectorAll("button")) button.disabled = true;

          modalEyebrow.textContent = `LAST CODE: ${currentCode}`;
          modalTitle.innerHTML = score === 1 ? "1 SECTOR<br />STABILIZED." : `${score} SECTORS<br />STABILIZED.`;
          modalText.textContent = score < 4
            ? "OPTICAL CALIBRATION INCOMPLETE. THE NEXT RUN WILL BEGIN WITH A SIMPLE SIGNAL."
            : "FOCUS LOCKED. CODES GROW LONGER AND THEIR DEPTH GAP SHRINKS AS YOU ADVANCE.";
          startButton.textContent = "REBOOT SEQUENCE";
          overlay.hidden = false;
          startButton.focus();
        }

        choiceGrid.addEventListener("click", (event) => {
          const button = event.target.closest("button[data-code]");
          if (!button || !running) return;
          checkAnswer(button.dataset.code, button);
        });
        startButton.addEventListener("click", beginGame);
        soundToggle.addEventListener("click", () => {
          soundEnabled = !soundEnabled;
          soundToggle.textContent = soundEnabled ? "SND ON" : "SND OFF";
          soundToggle.setAttribute("aria-label", soundEnabled ? "Mute sound" : "Enable sound");
          if (soundEnabled) {
            audioContext ??= new AudioContext();
            audioContext.resume();
            playSignal([520, 720]);
          }
        });
        shareButton.addEventListener("click", async () => {
          const url = location.protocol === "file:" ? "https://voodoohop.github.io/depth-lock/" : location.href;
          const shareData = {
            title: "Depth//Lock",
            text: "Can you decode the hidden 3D signal before time runs out?",
            url,
          };

          try {
            if (navigator.share) {
              await navigator.share(shareData);
            } else {
              await navigator.clipboard.writeText(url);
              shareButton.textContent = "LINK COPIED";
              window.setTimeout(() => {
                shareButton.textContent = "SHARE SIGNAL";
              }, 1600);
            }
          } catch (error) {
            if (error.name !== "AbortError") shareButton.textContent = "SHARE FAILED";
          }
        });
        const resizeObserver = new ResizeObserver(() => {
          clearTimeout(resizeTimer);
          resizeTimer = window.setTimeout(() => {
            stereoState = null;
            generateStereogram(currentCode);
          }, 120);
        });
        resizeObserver.observe(screenWrap);

        generateStereogram(currentCode);
        updateStats();
      })();
    </script>
  </body>
</html>
